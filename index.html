    <style>
      :root {
        color-scheme: light;
        font-family: Rockwell, "Roboto Slab", Georgia, "Times New Roman", serif;
        --navy: #0b2351;
        --navy-2: #13306a;
        --gold: #d8a514;
        --gold-deep: #94700a;
        --gold-soft: #f6ecd0;
        --paper: #ffffff;
        --ink-soft: #4a5672;
        background: #f7f4ec;
        color: var(--navy);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(18px, 4vw, 56px);
        background:
          radial-gradient(ellipse at 10% 0%, #ffffff 0, transparent 37rem),
          radial-gradient(ellipse at 100% 100%, #f3e6c2 0, transparent 30rem),
          #f7f4ec;
      }

      .landing {
        width: min(100%, 1120px);
        min-height: 620px;
        display: grid;
        grid-template-columns: 0.94fr 1.06fr;
        overflow: hidden;
        border: 1px solid #e8dfc8;
        border-radius: 30px;
        background: var(--paper);
        box-shadow: 0 30px 80px -48px #0b235166;
        animation: arrive 560ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: clamp(34px, 5.7vw, 72px);
      }

      .logo-wrap {
        display: flex;
        align-items: center;
        min-height: 116px;
        margin: 0 0 29px -8px;
        animation: rise-in 600ms 80ms ease-out both;
      }

      .logo {
        display: block;
        width: clamp(160px, 19vw, 210px);
        height: auto;
        max-height: 214px;
        object-fit: contain;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 18px;
        color: var(--gold-deep);
        font-family: Arial, sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        animation: rise-in 600ms 150ms ease-out both;
      }

      .eyebrow::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--gold);
        content: "";
      }

      h1 {
        max-width: 9ch;
        margin: 0;
        font-size: clamp(3.1rem, 6vw, 5.25rem);
        font-weight: 800;
        line-height: 0.99;
        letter-spacing: -0.055em;
        text-wrap: balance;
        animation: rise-in 650ms 210ms ease-out both;
      }

      .hl {
        background: linear-gradient(transparent 68%, #d8a51459 68% 92%, transparent 92%);
      }

      .intro {
        max-width: 32ch;
        margin: 22px 0 29px;
        color: var(--ink-soft);
        font-size: clamp(1.08rem, 2vw, 1.25rem);
        line-height: 1.58;
        animation: rise-in 650ms 280ms ease-out both;
      }

      .cta {
        min-height: 60px;
        width: min(100%, 370px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 13px;
        padding: 16px 22px;
        border: 2px solid var(--navy);
        border-radius: 6px;
        background: var(--navy);
        color: #ffffff;
        box-shadow: inset 0 -4px 0 var(--gold);
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.25;
        text-align: center;
        text-decoration: none;
        transition:
          background-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
        animation: rise-in 650ms 350ms ease-out both;
      }

      .cta:hover {
        transform: translateY(-2px);
        background: var(--gold);
        border-color: var(--gold);
        color: var(--navy);
        box-shadow: none;
      }

      .cta:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 5px;
      }

      .cta svg {
        width: 21px;
        height: 21px;
        flex: 0 0 auto;
        transition: transform 160ms ease;
      }

      .cta:hover svg {
        transform: translateX(4px);
      }

      .note {
        margin: 14px 0 0;
        color: #6b7590;
        font-size: 0.82rem;
        line-height: 1.5;
        animation: rise-in 650ms 410ms ease-out both;
      }

      .visual {
        position: relative;
        display: grid;
        place-items: center;
        min-width: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 42%, #1c3b7a 0 14%, transparent 14.2%),
          radial-gradient(circle at 52% 42%, #102c62 0 42%, transparent 42.2%),
          var(--navy);
      }

      .visual::before,
      .visual::after {
        position: absolute;
        top: 50%;
        left: 52%;
        width: min(78%, 500px);
        aspect-ratio: 1;
        border: 2px solid #d8a51466;
        border-radius: 50%;
        content: "";
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .visual::after {
        width: min(63%, 400px);
        border-style: dashed;
        border-color: #ffffff2e;
      }

      .scene {
        position: relative;
        z-index: 1;
        width: min(100%, 610px);
        overflow: visible;
      }

      .scene svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .flight-path {
        fill: none;
        stroke: var(--gold);
        stroke-dasharray: 3 11;
        stroke-linecap: round;
        stroke-width: 3;
        animation: route-flow 12s linear infinite;
      }

      .plane {
        transform-box: fill-box;
        transform-origin: center;
        animation: plane-bob 3.8s ease-in-out infinite;
      }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes rise-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes route-flow {
        to { stroke-dashoffset: -56; }
      }

      @keyframes plane-bob {
        0%, 100% { transform: translate(0, 0) rotate(-3deg); }
        50% { transform: translate(4px, -6px) rotate(1deg); }
      }

      @media (max-width: 760px) {
        body {
          padding: 18px;
        }

        .landing {
          width: min(100%, 520px);
          min-height: 0;
          grid-template-columns: 1fr;
          border-radius: 24px;
        }

        .content {
          align-items: center;
          padding: 26px 28px 34px;
          text-align: center;
        }

        .logo-wrap {
          min-height: 120px;
          margin: 0 0 12px;
        }

        .logo {
          width: 150px;
          max-height: 154px;
        }

        .eyebrow {
          margin-bottom: 15px;
          font-size: 0.67rem;
        }

        h1 {
          max-width: 10ch;
          font-size: clamp(3rem, 13vw, 4.3rem);
        }

        .intro {
          max-width: 27ch;
          margin: 15px 0 23px;
          font-size: 1.05rem;
        }

        .cta {
          width: 100%;
          max-width: 370px;
        }

        .visual {
          min-height: clamp(250px, 67vw, 350px);
        }

        .scene {
          width: min(100%, 420px);
        }

        .visual::before {
          width: min(78%, 360px);
        }

        .visual::after {
          width: min(63%, 290px);
        }
      }

      @media (max-width: 380px) {
        body { padding: 12px; }
        .content { padding-inline: 20px; }
        .note { font-size: 0.76rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
